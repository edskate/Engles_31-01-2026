<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control 001</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #000000;
        }
        p {
            margin-bottom: 10px;
            color: #fff5f5;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
        }
        i {
            color: red;
        }
        table,th,td
    {
                width: 50%;
                border-collapse: collapse;
                margin-top: 20px;
                text-align: left;
                text-shadow: 3px 3px 3px rgba(0, 0, 0, 0.1);
                border: 5px solid #727171;
                background-color: rgba(6, 222, 230, 0.37);
                color: #ff0000;
            }
            button {
                margin-top: 20px;
                padding: 10px 20px;
                background-color: #4CAF50;
                color: rgb(0, 0, 0);
            
               
            }
            h1 {
                color: #00ff00;
                text-shadow: 2px 2px 2px rgba(0, 0, 0, 0.1);
            }
    </style>
</head>
<body>
    <h1>Control 001</h1>

    <p>Hi <span id="name">John Doe</span></p>
    <p>do you like coding?</p>
    <p>yes</p>
    <p>She wants to learn coding.</p>
    <p>yes </p>
    <p>I can't</p>
    <p>I know this </p>
    <p>yes you can do it
    <p>do you</p>
    <p>present tense</p>
    <hr>
    <p>but I can't believe it.</p>
    <p>Can</p>
    
</body>
</html>
