<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Coreografia — EdyMichaelCover</title>

<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
}

h1{color:gold;}

.container{
background:#111;
padding:20px;
margin:20px auto;
width:90%;
max-width:800px;
border-radius:10px;
}

select,button,textarea{
padding:10px;
margin:5px;
width:90%;
}

textarea{
height:80px;
resize:none;
}

button{
background:gold;
border:none;
cursor:pointer;
font-weight:bold;
}

.btn-danger{
background:red;
color:white;
}

.btn-pdf{
background:#00aa55;
color:white;
}

table{
width:95%;
margin:auto;
margin-top:20px;
border-collapse:collapse;
}

td,th{
border:1px solid gold;
padding:8px;
}

.apto{color:#00ff88;}
.treino{color:#ffaa00;}
.nao{color:red;}

@media print {
button, .container {
display:none;
}
body{
background:white;
color:black;
}
td,th{
border:1px solid black;
}
}
</style>
</head>

<body>

<h1>🎭 Painel de Coreografia</h1>

<div class="container">

<select id="dancarino">
<option>Abizael</option>
<option>Renan</option>
<option>Patrick</option>
<option>Jhonny</option>
<option>Luizza Recepcionista</option>
<option>Helama</option>
</select>

<select id="coreografia">
<option>Jam</option>
<option>Dangerous</option>
<option>Beat It</option>
<option>Bad</option>
<option>Thriller</option>
</select>

<select id="nivel">
<option value="apto">🟢 Apto</option>
<option value="treino">🟡 Em treino</option>
<option value="nao">🔴 Não apto</option>
</select>

<textarea id="correcao" placeholder="Correções técnicas (movimento, postura, fluidez...)"></textarea>

<button onclick="salvar()">Salvar Status</button>
<button class="btn-danger" onclick="limpar()">🧹 Limpar Tudo</button>
<button class="btn-pdf" onclick="gerarPDF()">📄 Salvar em PDF</button>

</div>

<table>
<thead>
<tr>
<th>Dançarino</th>
<th>Coreografia</th>
<th>Status</th>
<th>Correção Técnica</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<script>
let dados = JSON.parse(localStorage.getItem("coreografia")) || [];

function salvar(){
let nome = document.getElementById("dancarino").value;
let coreo = document.getElementById("coreografia").value;
let nivel = document.getElementById("nivel").value;
let correcao = document.getElementById("correcao").value;

dados.push({nome, coreo, nivel, correcao});

localStorage.setItem("coreografia", JSON.stringify(dados));

document.getElementById("correcao").value = "";

mostrar();
}

function mostrar(){
let tabela = document.getElementById("tabela");
tabela.innerHTML = "";

dados.forEach(d=>{
tabela.innerHTML += `
<tr>
<td>${d.nome}</td>
<td>${d.coreo}</td>
<td class="${d.nivel}">${d.nivel.toUpperCase()}</td>
<td>${d.correcao || "-"}</td>
</tr>
`;
});
}

function limpar(){
if(confirm("Deseja apagar todos os dados?")){
localStorage.removeItem("coreografia");
dados = [];
mostrar();
}
}

function gerarPDF(){
window.print();
}

mostrar();
</script>
🇭🇹
<hr>
<a href="Direcao05.html">Painel Coreografia</a>
</body>
</html>
